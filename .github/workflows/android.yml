name: Build Android APK
on:
  push:
    branches: [main]
    paths: ["web/**", "android-signing/**", "android-res/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - run: echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/platforms | tail -3
      - name: Fixed signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: npx cap add android
      - name: App icons
        run: cp -r android-res/* android/app/src/main/res/
      - name: Version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Use fixed signing key
        run: |
          cat >> android/app/build.gradle <<'G'
          android { signingConfigs { debug { storeFile rootProject.file('../android-signing/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } } }
          G
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk cnc-quiz.apk
      - uses: actions/upload-artifact@v4
        with: { name: cnc-quiz-apk, path: cnc-quiz.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: CNC 数控闯关 安卓版 1.0.${{ github.run_number }}
          body: 下载 cnc-quiz.apk 到安卓手机安装（需允许“安装未知来源应用”）。
          files: cnc-quiz.apk
          make_latest: true
