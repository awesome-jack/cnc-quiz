name: Build Android APK
on:
  push:
    branches: [main]
    paths: ["web/**", "android-res/**", "capacitor.config.json", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx cap add android
      - name: App icons
        run: cp -r android-res/* android/app/src/main/res/
      - name: Version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk cnc-quiz.apk
      - uses: actions/upload-artifact@v4
        with: { name: cnc-quiz-apk, path: cnc-quiz.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: CNC 数控闯关 安卓版 1.0.${{ github.run_number }}
          body: 下载 cnc-quiz.apk 到安卓手机安装（需允许“安装未知来源应用”）。
          files: cnc-quiz.apk
          make_latest: true
